<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日一篇 · 电子书阅读</title>
<meta name="description" content="每天一篇精选电子书，深度阅读，持续成长" />
<link rel="preconnect" href="https://images.unsplash.com" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Background Layer -->
<div class="bg-layer" id="bg-layer" aria-hidden="true"></div>

<!-- Header -->
<header class="header">
  <a href="#" class="brand" aria-label="每日一篇首页">
    <span class="brand-icon">📖</span>
    <div class="brand-text">
      <span class="brand-title">每日一篇</span>
      <span class="brand-sub">Daily Ebook Reading</span>
    </div>
  </a>
  <nav class="nav" aria-label="筛选分类">
    <button class="nav-btn filter-tab active" data-filter="all">全部</button>
    <button class="nav-btn filter-tab" data-filter="2026-11">11月</button>
    <button class="nav-btn filter-tab" data-filter="2026-10">10月</button>
    <button class="nav-btn filter-tab" data-filter="2026-09">9月</button>
  </nav>
  <span class="today-badge" id="today-badge">更新中</span>
</header>

<!-- Main Content -->
<main class="main">

  <!-- Hero: Today's Featured Book -->
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-grid">
      <div class="hero-cover">
        <img id="hero-cover-img" src="" alt="" loading="eager">
        <div class="cover-overlay"></div>
        <span class="cover-badge" id="hero-badge">今日荐读</span>
      </div>
      <div class="hero-content">
        <div class="hero-meta">
          <span class="meta-tag" id="hero-category">分类</span>
          <span class="meta-tag" id="today-badge-text">今天</span>
        </div>
        <h1 class="hero-title" id="hero-title">加载中…</h1>
        <p class="hero-author" id="hero-author">作者：<strong>—</strong></p>
        <p class="hero-desc" id="hero-desc">正在加载今日推荐…</p>

        <div class="hero-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="hero-progress-fill" style="width: 0%"></div>
          </div>
          <span class="progress-text" id="hero-progress-text">阅读进度：0%</span>
        </div>

        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-read-btn" data-book-id="">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            开始阅读
          </button>
          <button class="btn btn-ghost" id="hero-preview-btn" data-book-id="">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            目录预览
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Books Archive -->
  <section class="archive" aria-labelledby="archive-title">
    <div class="section-head">
      <h2 class="section-title" id="archive-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        往期荐读
      </h2>
      <a href="#" class="view-all">查看全部 →</a>
    </div>
    <div class="books-grid" id="books-grid" role="list">
      <!-- 动态渲染 -->
    </div>
  </section>

</main>

<!-- Footer -->
<footer class="footer">
  <p>© 2026 每日一篇 · 电子书阅读计划</p>
  <p>数据来源：公开书籍信息 · 封面图片来自 Unsplash</p>
  <p>部署：GitHub Pages · 维护：yww006</p>
</footer>

<!-- Modal: Book Detail -->
<div class="modal" id="book-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop" tabindex="-1"></div>
  <div class="modal-content">
    <div class="modal-header">
      <img id="modal-cover" src="" alt="">
      <button class="modal-close" id="modal-close" aria-label="关闭详情">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-meta" id="modal-meta"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-author" id="modal-author"></p>
      <p class="modal-desc" id="modal-desc"></p>

      <!-- Modal Tabs -->
      <div class="modal-tabs" role="tablist" aria-label="内容标签">
        <button class="modal-tab active" data-tab="catalog" role="tab" aria-selected="true" aria-controls="panel-catalog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
          目录
        </button>
        <button class="modal-tab" data-tab="highlights" role="tab" aria-selected="false" aria-controls="panel-highlights">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><path d="M4 21h16"/><path d="M9 17v-6a2 2 0 0 1 2-2h6"/></svg>
          金句
        </button>
        <button class="modal-tab" data-tab="reading" role="tab" aria-selected="false" aria-controls="panel-reading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          阅读
        </button>
      </div>

      <!-- Panel: Catalog -->
      <section class="modal-panel" id="panel-catalog" role="tabpanel" aria-labelledby="chapters-title" hidden="false">
        <h3 class="modal-section-title" id="chapters-title">章节目录</h3>
        <ul class="chapter-list" id="modal-chapters"></ul>
      </section>

      <!-- Panel: Highlights -->
      <section class="modal-panel" id="panel-highlights" role="tabpanel" aria-labelledby="highlights-title" hidden="true">
        <h3 class="modal-section-title" id="highlights-title">金句摘录</h3>
        <ul class="highlight-list" id="modal-highlights"></ul>
      </section>

      <!-- Panel: Reading -->
      <section class="modal-panel reading-panel" id="panel-reading" role="tabpanel" aria-labelledby="reading-title" hidden="true">
        <div class="reading-header">
          <h3 class="modal-section-title" id="reading-title">正文阅读</h3>
          <div class="reading-controls">
            <button class="reading-control-btn" id="reading-font-smaller" aria-label="缩小字体">A-</button>
            <button class="reading-control-btn" id="reading-font-larger" aria-label="放大字体">A+</button>
            <button class="reading-control-btn" id="reading-theme-toggle" aria-label="切换主题">☀/🌙</button>
          </div>
        </div>
        <div class="reading-content" id="modal-reading"></div>
        <div class="reading-progress-bar" id="reading-progress-bar" aria-label="阅读进度"></div>
      </section>

    </div>
  </div>
</div>

<script src="js/app.js" data-cf-rocket-loader="false"></script>
</body>
</html>
